# The eval gate. CI fails (exit code 1) if a metric drops below its minimum.
# Raise these as the system improves; never lower them to make a change pass
# without writing down why.
retrieval:            # deterministic, no LLM, runs on every PR
  hit_rate_at_k: 0.85
  mrr: 0.60
end_to_end:           # needs a real LLM, run manually / nightly
  schema_valid_rate: 1.00
  citation_valid_rate: 0.95
  docs_gap_accuracy: 0.80
  category_accuracy: 0.60