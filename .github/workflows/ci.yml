name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Unit tests (fake LLM, no network)
        run: pytest -q

      # Fails the build (exit 1) if retrieval quality drops below
      # evals/thresholds.yaml, e.g. after a chunking, KB or retriever change.
      - name: Eval gate (retrieval, deterministic)
        run: python -m evals.run_eval --no-history

      - name: Build image
        run: docker build -t ticket-copilot:${{ github.sha }} .